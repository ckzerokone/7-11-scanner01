
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>7-11 效期掃描</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
  color: #fff;
  font-family: -apple-system, "Noto Sans TC", sans-serif;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Camera ── */
#video {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* ── Overlay ── */
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

/* scanning frame */
.scan-frame {
  width: 78vw;
  height: 100px;
  border: 2.5px solid rgba(255,255,255,.75);
  border-radius: 12px;
  position: relative;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
}
.scan-frame::before,
.scan-frame::after {
  content: '';
  position: absolute;
  width: 22px; height: 22px;
  border-color: #4caf50;
  border-style: solid;
}
.scan-frame::before { top: -3px; left: -3px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
.scan-frame::after  { top: -3px; right: -3px; border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
.scan-frame .corner-bl,
.scan-frame .corner-br {
  position: absolute;
  width: 22px; height: 22px;
  border-color: #4caf50;
  border-style: solid;
}
.scan-frame .corner-bl { bottom: -3px; left: -3px; border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
.scan-frame .corner-br { bottom: -3px; right: -3px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }

/* scan line animation */
.scan-line {
  position: absolute;
  left: 4px; right: 4px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #4caf50, transparent);
  top: 50%;
  animation: scanMove 1.8s ease-in-out infinite;
}
@keyframes scanMove {
  0%   { top: 10%; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { top: 88%; opacity: 0; }
}

.scan-hint {
  margin-top: 14px;
  font-size: 14px;
  color: rgba(255,255,255,.7);
  text-shadow: 0 1px 4px rgba(0,0,0,.8);
}

/* ── Header ── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
}
.header h1 { font-size: 17px; font-weight: 700; }
.header .btns { display: flex; gap: 10px; }
.icon-btn {
  width: 38px; height: 38px;
  background: rgba(255,255,255,.18);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: all;
}

/* ── Status Banner ── */
.status-banner {
  position: fixed;
  left: 0; right: 0; top: 0;
  z-index: 25;
  padding: 20px 20px 24px;
  padding-top: max(56px, calc(env(safe-area-inset-top) + 44px));
  transform: translateY(-100%);
  transition: transform .3s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.status-banner.show { transform: translateY(0); }

.status-banner.normal    { background: #1b5e20; }
.status-banner.izhenshi  { background: #f57f17; }
.status-banner.expired   { background: #b71c1c; }
.status-banner.invalid   { background: rgba(40,40,40,.95); }

.status-icon { font-size: 40px; }
.status-text { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
.status-sub  { font-size: 15px; opacity: .85; text-align: center; }

.barcode-raw {
  font-size: 12px;
  font-family: monospace;
  opacity: .5;
  margin-top: 4px;
}

/* ── History Panel ── */
.history-panel {
  position: fixed;
  top: 0; right: -100%;
  width: min(340px, 92vw);
  height: 100%;
  background: #111;
  z-index: 50;
  transition: right .3s ease;
  display: flex;
  flex-direction: column;
  padding-top: max(60px, env(safe-area-inset-top));
}
.history-panel.open { right: 0; }
.history-panel h2 { font-size: 17px; padding: 16px; border-bottom: 1px solid #333; }
.history-list { flex: 1; overflow-y: auto; }
.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid #222;
}
.history-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-normal   { background: #4caf50; }
.dot-clearance { background: #ff6d00; }
.dot-expired  { background: #f44336; }
.dot-invalid  { background: #666; }
.history-content { flex: 1; }
.history-barcode { font-size: 13px; font-family: monospace; color: #aaa; }
.history-status  { font-size: 15px; font-weight: 600; }
.history-time    { font-size: 12px; color: #666; margin-top: 2px; }
.history-empty { text-align: center; color: #444; padding: 40px 16px; font-size: 15px; }

.close-btn {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: 12px;
  background: #333;
  border: none;
  border-radius: 50%;
  width: 34px; height: 34px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Settings Panel ── */
.settings-panel {
  position: fixed;
  bottom: -100%;
  left: 0; right: 0;
  background: #1a1a1a;
  border-radius: 20px 20px 0 0;
  z-index: 50;
  transition: bottom .3s ease;
  padding: 20px 20px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}
.settings-panel.open { bottom: 0; }
.settings-panel h2 { font-size: 17px; margin-bottom: 18px; text-align: center; }

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #333;
}
.setting-label { font-size: 15px; }
.setting-sub   { font-size: 12px; color: #888; margin-top: 2px; }

.toggle {
  width: 48px; height: 26px;
  background: #444;
  border-radius: 13px;
  position: relative;
  cursor: pointer;
  transition: background .2s;
  border: none;
  flex-shrink: 0;
}
.toggle.on { background: #4caf50; }
.toggle::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  background: #fff;
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: transform .2s;
}
.toggle.on::after { transform: translateX(22px); }

.close-settings {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  background: #333;
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 40;
  display: none;
}
.backdrop.show { display: block; }

/* ── Manual entry ── */
.manual-btn {
  position: fixed;
  bottom: max(28px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 20px;
  color: #fff;
  font-size: 13px;
  padding: 8px 18px;
  cursor: pointer;
  pointer-events: all;
  backdrop-filter: blur(8px);
}

/* ── Error state ── */
.cam-error {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 24px;
  text-align: center;
  background: #000;
}
.cam-error .icon { font-size: 56px; }
.cam-error p { font-size: 16px; color: #bbb; line-height: 1.5; }
.cam-error button {
  margin-top: 12px;
  padding: 12px 28px;
  background: #4caf50;
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

/* ── Manual Input Modal ── */
.manual-modal {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(0,0,0,.75);
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.manual-modal.open { display: flex; }
.manual-modal-box {
  background: #1a1a1a;
  border-radius: 20px 20px 0 0;
  padding: 24px 20px;
  padding-bottom: max(28px, env(safe-area-inset-bottom));
  width: 100%;
}
.manual-modal-box h3 { font-size: 17px; margin-bottom: 16px; text-align: center; }
.manual-input {
  width: 100%;
  padding: 14px 16px;
  background: #333;
  border: 2px solid #555;
  border-radius: 12px;
  color: #fff;
  font-size: 22px;
  font-family: monospace;
  letter-spacing: 2px;
  text-align: center;
  outline: none;
  margin-bottom: 14px;
}
.manual-input:focus { border-color: #4caf50; }
.manual-btns { display: flex; gap: 10px; }
.manual-btns button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn-confirm { background: #4caf50; color: #fff; }
.btn-cancel  { background: #333; color: #aaa; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>

<!-- Header -->
<div class="header">
  <h1>🏪 7-11 效期掃描</h1>
  <div class="btns">
    <button class="icon-btn" onclick="openSettings()" title="設定">⚙️</button>
    <button class="icon-btn" onclick="openHistory()" title="歷史紀錄">📋</button>
  </div>
</div>

<!-- Scan overlay -->
<div class="overlay">
  <div class="scan-frame">
    <div class="corner-bl"></div>
    <div class="corner-br"></div>
    <div class="scan-line"></div>
  </div>
  <div class="scan-hint">將條碼對準框內</div>
</div>

<!-- Manual entry button -->
<button class="manual-btn" onclick="manualEntry()">✏️ 手動輸入條碼</button>

<!-- Status Banner -->
<div class="status-banner invalid" id="status-banner">
  <div class="status-icon" id="status-icon">📦</div>
  <div class="status-text" id="status-text">等待掃描</div>
  <div class="status-sub" id="status-sub">將條碼對準上方框框</div>
  <div class="barcode-raw" id="barcode-raw"></div>
</div>

<!-- History Panel -->
<div class="history-panel" id="history-panel">
  <h2>掃描紀錄</h2>
  <button class="close-btn" onclick="closeHistory()">✕</button>
  <div class="history-list" id="history-list"></div>
</div>

<!-- Settings Panel -->
<div class="settings-panel" id="settings-panel">
  <h2>設定</h2>

  <div class="setting-row">
    <div>
      <div class="setting-label">提早出清模式</div>
      <div class="setting-sub">提前 1 小時開始貼出清標</div>
    </div>
    <button class="toggle" id="toggle-early" onclick="toggleEarly()"></button>
  </div>

  <div class="setting-row">
    <div>
      <div class="setting-label">語音提示</div>
      <div class="setting-sub">掃描後語音播報結果</div>
    </div>
    <button class="toggle on" id="toggle-voice" onclick="toggleVoice()"></button>
  </div>

  <div class="setting-row">
    <div>
      <div class="setting-label">震動回饋</div>
      <div class="setting-sub">依狀態震動</div>
    </div>
    <button class="toggle on" id="toggle-vibrate" onclick="toggleVibrate()"></button>
  </div>

  <div class="setting-row" style="border:none">
    <div>
      <div class="setting-label">說明：末五碼格式</div>
      <div class="setting-sub">僅2開頭條碼有效。第9-12碼格式：DDDT<br>DDD=年內天數，T=時段碼（1=24:00, 3=03:00, 6=17:00）</div>
    </div>
  </div>

  <button class="close-settings" onclick="closeSettings()">關閉</button>
</div>

<div class="backdrop" id="backdrop" onclick="closeAll()"></div>

<!-- Camera error -->
<!-- Manual Input Modal -->
<div class="manual-modal" id="manual-modal">
  <div class="manual-modal-box">
    <h3>✏️ 手動輸入條碼</h3>
    <input class="manual-input" id="manual-input" type="text" inputmode="numeric"
      maxlength="13" placeholder="輸入 13 位條碼"
      onkeydown="if(event.key==='Enter') confirmManual()">
    <div class="manual-btns">
      <button class="btn-cancel" onclick="closeManual()">取消</button>
      <button class="btn-confirm" onclick="confirmManual()">確認</button>
    </div>
  </div>
</div>

<div class="cam-error" id="cam-error" style="display:none">
  <div class="icon">📷</div>
  <p>無法開啟相機<br>請確認已授予相機使用權限，然後重新整理頁面</p>
  <button onclick="startCamera()">重試</button>
  <button onclick="manualEntry()" style="margin-top:0;background:#333;">✏️ 手動輸入條碼</button>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────
let earlyMode   = false;
let voiceOn     = true;
let vibrateOn   = true;
let scanning    = true;
let lastBarcode = '';
let lastScanTime = 0;
const SCAN_COOLDOWN = 2500; // ms between repeated same barcode

const history = JSON.parse(localStorage.getItem('scan_history') || '[]');

// ── Camera ─────────────────────────────────────────────────────────────
const video = document.getElementById('video');
let detector = null;
let animFrame = null;

async function startCamera() {
  document.getElementById('cam-error').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      }
    });
    video.srcObject = stream;
    await video.play();
    initScanner();
  } catch (e) {
    document.getElementById('cam-error').style.display = 'flex';
  }
}

// ── Scanner ─────────────────────────────────────────────────────────────
async function initScanner() {
  if ('BarcodeDetector' in window) {
    try {
      detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39'] });
      scanLoop();
      return;
    } catch(e) {}
  }
  // Fallback: no native BarcodeDetector — show manual only notice
  console.log('BarcodeDetector not available, use manual entry');
  showStatus('invalid', '❗', '相機掃描不支援', '請使用「手動輸入條碼」', '');
}

async function scanLoop() {
  if (!scanning || video.readyState < 2) {
    animFrame = requestAnimationFrame(scanLoop);
    return;
  }
  try {
    const barcodes = await detector.detect(video);
    for (const b of barcodes) {
      const raw = b.rawValue;
      const now = Date.now();
      if (raw === lastBarcode && now - lastScanTime < SCAN_COOLDOWN) continue;
      lastBarcode  = raw;
      lastScanTime = now;
      processBarcode(raw);
      break;
    }
  } catch(e) {}
  animFrame = requestAnimationFrame(scanLoop);
}

// ── Barcode Logic ───────────────────────────────────────────────────────
function parseBarcode(raw) {
  if (raw.length !== 13) return null;
  if (raw[0] !== '2') return null; // 只有2開頭才是時控商品

  // 第9-12碼 (1-indexed) = substring(8,12)，格式：DDDT
  // DDD = 年內第幾天，T = 時段碼（1=24:00, 3=03:00, 6=17:00）
  const code = raw.substring(8, 12);
  const dayOfYear = parseInt(code.substring(0, 3), 10);
  const tc = parseInt(code[3], 10);

  if (![1, 3, 6].includes(tc)) return null;
  if (dayOfYear < 1 || dayOfYear > 366) return null;

  const now  = new Date();
  const year = now.getFullYear();

  // 年內天數轉日期
  function doyToDate(y, doy) { return new Date(y, 0, doy); }
  let d = doyToDate(year, dayOfYear);
  const mm = d.getMonth() + 1;
  const dd = d.getDate();

  // 建立到期時間
  let expiry;
  if (tc === 1) expiry = new Date(year, mm-1, dd+1, 0, 0, 0); // 24:00 = 隔天 00:00
  else if (tc === 3) expiry = new Date(year, mm-1, dd, 3, 0, 0);
  else expiry = new Date(year, mm-1, dd, 17, 0, 0); // tc===6, 17:00

  // 超過180天前 → 試明年
  if (now - expiry > 180 * 86400000) {
    d = doyToDate(year+1, dayOfYear);
    const nm = d.getMonth()+1, nd = d.getDate();
    if (tc === 1) expiry = new Date(year+1, nm-1, nd+1, 0, 0, 0);
    else if (tc === 3) expiry = new Date(year+1, nm-1, nd, 3, 0, 0);
    else expiry = new Date(year+1, nm-1, nd, 17, 0, 0);
  }

  // 出清時間（17:00 → 90分前，其餘 → 120分前）
  let clearanceMins = tc === 6 ? 90 : 120;
  if (earlyMode) clearanceMins += 60;
  const clearance = new Date(expiry.getTime() - clearanceMins * 60000);

  const tcLabel = { 1:'24:00', 3:'03:00', 6:'17:00' }[tc];
  return { mm, dd, tc, tcLabel, expiry, clearance };
}

function processBarcode(raw) {
  const parsed = parseBarcode(raw);

  if (!parsed) {
    // Non-time-controlled barcode — just show raw info
    feedback('invalid');
    showStatus('invalid', '📦', '非時控商品', '此條碼非效期時控格式', raw);
    addHistory(raw, 'invalid', '非時控商品');
    return;
  }

  const now = new Date();
  let statusClass, icon, text, sub;

  if (now >= parsed.expiry) {
    statusClass = 'expired';
    icon = '🔴';
    text = '過期 請下架';
    sub  = `到期：${parsed.mm}/${parsed.dd} ${parsed.tcLabel}`;
  } else if (needsIZhenshi(now, parsed)) {
    statusClass = 'izhenshi';
    icon = '🟡';
    text = 'i珍食 要貼貼紙';
    sub  = `到期：${parsed.mm}/${parsed.dd} ${parsed.tcLabel}`;
  } else {
    statusClass = 'normal';
    icon = '🟢';
    text = '正常';
    sub  = `到期：${parsed.mm}/${parsed.dd} ${parsed.tcLabel}　出清：${fmt(parsed.clearance)}`;
  }

  feedback(statusClass);
  showStatus(statusClass, icon, text, sub, raw);
  addHistory(raw, statusClass, text);
}

function needsIZhenshi(now, p) {
  if (now >= p.clearance) return true;
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let expiryDay = new Date(now.getFullYear(), p.mm - 1, p.dd);
  if (expiryDay < todayStart) expiryDay.setFullYear(now.getFullYear() + 1);
  // tc=3 凌晨03:00到期 → 前一天17:00就要貼；tc=1/6 → 當天17:00
  const triggerDay = p.tc === 3
    ? new Date(expiryDay.getTime() - 86400000)
    : expiryDay;
  if (todayStart.getTime() === triggerDay.getTime()) {
    const trigger = new Date(todayStart.getFullYear(), todayStart.getMonth(), todayStart.getDate(), 17, 0, 0);
    if (now >= trigger) return true;
  }
  return false;
}

// ── Display ─────────────────────────────────────────────────────────────
function showStatus(cls, icon, text, sub, raw) {
  const banner = document.getElementById('status-banner');
  banner.className = `status-banner show ${cls}`;
  document.getElementById('status-icon').textContent = icon;
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-sub').textContent  = sub;
  document.getElementById('barcode-raw').textContent  = raw ? `條碼：${raw}` : '';
}

function fmt(date) {
  const h = String(date.getHours()).padStart(2,'0');
  const m = String(date.getMinutes()).padStart(2,'0');
  return `${h}:${m}`;
}

// ── Feedback ─────────────────────────────────────────────────────────────
const voiceTexts = { normal: '正常', izhenshi: '要貼貼紙', expired: '請下架', invalid: '' };
const vibPatterns = { normal: [80], izhenshi: [80, 60, 80], expired: [2500], invalid: [30] };

function feedback(status) {
  if (vibrateOn && 'vibrate' in navigator) {
    navigator.vibrate(vibPatterns[status] || [50]);
  }
  if (voiceOn && voiceTexts[status]) {
    const u = new SpeechSynthesisUtterance(voiceTexts[status]);
    u.lang = 'zh-TW';
    u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
}

// ── History ─────────────────────────────────────────────────────────────
function addHistory(barcode, status, statusText) {
  const now  = new Date();
  const time = `${now.getMonth()+1}/${now.getDate()} ${fmt(now)}`;
  history.unshift({ barcode, status, statusText, time });
  if (history.length > 500) history.pop();
  localStorage.setItem('scan_history', JSON.stringify(history));
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">尚無掃描紀錄</div>';
    return;
  }
  list.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="history-dot dot-${h.status}"></div>
      <div class="history-content">
        <div class="history-barcode">${h.barcode}</div>
        <div class="history-status">${h.statusText}</div>
        <div class="history-time">${h.time}</div>
      </div>
    </div>
  `).join('');
}

// ── Panels ─────────────────────────────────────────────────────────────
function openHistory() {
  renderHistory();
  document.getElementById('history-panel').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}
function closeHistory() {
  document.getElementById('history-panel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
function openSettings() {
  document.getElementById('settings-panel').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}
function closeSettings() {
  document.getElementById('settings-panel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
function closeAll() { closeHistory(); closeSettings(); }

// ── Toggles ─────────────────────────────────────────────────────────────
function toggleEarly() {
  earlyMode = !earlyMode;
  document.getElementById('toggle-early').classList.toggle('on', earlyMode);
}
function toggleVoice() {
  voiceOn = !voiceOn;
  document.getElementById('toggle-voice').classList.toggle('on', voiceOn);
}
function toggleVibrate() {
  vibrateOn = !vibrateOn;
  document.getElementById('toggle-vibrate').classList.toggle('on', vibrateOn);
}

// ── Manual Entry ─────────────────────────────────────────────────────────
function manualEntry() {
  const modal = document.getElementById('manual-modal');
  const input = document.getElementById('manual-input');
  input.value = '';
  modal.classList.add('open');
  setTimeout(() => input.focus(), 100);
}
function closeManual() {
  document.getElementById('manual-modal').classList.remove('open');
}
function confirmManual() {
  const code = document.getElementById('manual-input').value.trim().replace(/\s/g, '');
  closeManual();
  if (code) {
    lastBarcode  = code;
    lastScanTime = Date.now();
    processBarcode(code);
  }
}

// ── Init ─────────────────────────────────────────────────────────────────
startCamera();
</script>
</body>
</html>
